[project]
name = "o_leitor"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "whosmitri", email = "hellomitrii@gmail.com" }
]
dependencies = [
    "flet>=0.86.5",
    "PyMuPDF"
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
]

[tool.flet.android]
target_arch = ["arm64-v8a"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.mycompany"
product = " O Leitor"
company = "Autrius"
copyright = "Copyright (C) 2023-2026 by Flet"
icon_path = "assets/icons/icon.png"

[tool.flet.app]
path = "src"
name = "OLeitor"

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "^1.1.0"

[tool.flet.splash]
color = "#FFFFFF"
dark_color = "#463F3A"

[tool.flet.assets]
include = ["**/*"]
