name: Build APK
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Build Flet App
        id: build-flet-apk
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          working-directory: o_leitor/
          runner-python-version: "3.13"
          extra-args: '-v'
          # cache: # true or false | optional, default is true
          archive-output: false
        
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: o-leitor-apk
          path: ${{ steps.build-flet-apk.outputs.output-path }}/*.apk
          if-no-files-found: error
          
